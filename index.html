<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Bots</title>
  <link rel="icon" href="ultimatebotslogo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
    }

    nav {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }

    nav button {
      padding: 0.5rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      background-color: #7a42f4;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    nav button.active, nav button:hover {
      background-color: #692ee0;
    }

    .panel {
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
      padding: 2rem;
      display: none;
      animation: fadeInUp 0.6s forwards;
    }

    .panel.active {
      display: block;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
      from {
        opacity: 0;
        transform: translateY(20px);
      }
    }

    /* Login styles */
    #login h2 {
      text-align: center;
      margin-bottom: 1rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s ease;
    }

    input[type="password"]:focus {
      border-color: #7a42f4;
    }

    button#submitBtn {
      width: 100%;
      padding: 0.75rem;
      background-color: #7a42f4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button#submitBtn:hover {
      background-color: #692ee0;
      transform: scale(1.02);
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 0.5rem;
      display: none;
    }

    #spinner {
      display: none;
      margin: 1rem auto 0;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #7a42f4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Showcases styles */
    #showcases h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    #fileInput {
      display: block;
      margin: 1rem auto;
    }

    .preview {
      margin-top: 2rem;
      display: grid;
      gap: 1.5rem;
    }

    .preview-item {
      text-align: center;
    }

    video, img {
      max-width: 100%;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <nav>
    <button id="menuLogin" class="active">Login</button>
    <button id="menuShowcases">Showcases</button>
  </nav>

  <div id="login" class="panel active">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Password" autofocus />
    <button id="submitBtn">Unlock</button>
    <div id="spinner"></div>
    <div id="error">❌ Incorrect password. Try again.</div>
    <div id="content" style="display:none; text-align:center; margin-top: 1rem;">
      <h1>✅ Access Granted</h1>
      <p>Welcome to the protected content. Enjoy your stay!</p>
    </div>
  </div>

  <div id="showcases" class="panel">
    <h1>📂 Upload Your Showcase</h1>
    <input type="file" id="fileInput" accept=".mp4,.png,.jpg,.jpeg" multiple />
    <div class="preview" id="preview"></div>
  </div>

  <script>
    // Navigation buttons
    const menuLogin = document.getElementById('menuLogin');
    const menuShowcases = document.getElementById('menuShowcases');

    // Panels
    const loginPanel = document.getElementById('login');
    const showcasesPanel = document.getElementById('showcases');

    function showPanel(panelToShow) {
      // Hide all panels
      [loginPanel, showcasesPanel].forEach(p => p.classList.remove('active'));

      // Remove active class from all buttons
      [menuLogin, menuShowcases].forEach(btn => btn.classList.remove('active'));

      // Show chosen panel
      panelToShow.classList.add('active');

      // Activate correct menu button
      if (panelToShow === loginPanel) menuLogin.classList.add('active');
      else if (panelToShow === showcasesPanel) menuShowcases.classList.add('active');
    }

    menuLogin.addEventListener('click', () => {
      showPanel(loginPanel);
    });

    menuShowcases.addEventListener('click', () => {
      showPanel(showcasesPanel);
    });

    // Password check logic
    const correctPassword = "ultimatebots";

    const passwordInput = document.getElementById('passwordInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorDiv = document.getElementById('error');
    const spinner = document.getElementById('spinner');
    const contentDiv = document.getElementById('content');

    async function checkPassword() {
      errorDiv.style.display = "none";
      spinner.style.display = "block";

      await new Promise(r => setTimeout(r, 600));

      if (passwordInput.value === correctPassword) {
        spinner.style.display = "none";
        errorDiv.style.display = "none";
        contentDiv.style.display = "block";
      } else {
        spinner.style.display = "none";
        errorDiv.style.display = "block";
        contentDiv.style.display = "none";
      }
    }

    submitBtn.addEventListener('click', checkPassword);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkPassword();
      errorDiv.style.display = 'none';
    });

    // Showcases file upload preview
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');

    fileInput.addEventListener('change', () => {
      preview.innerHTML = '';
      const files = Array.from(fileInput.files);

      files.forEach(file => {
        const fileURL = URL.createObjectURL(file);
        const item = document.createElement('div');
        item.className = 'preview-item';

        if (file.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = fileURL;
          item.appendChild(img);
        } else if (file.type === 'video/mp4') {
          const video = document.createElement('video');
          video.src = fileURL;
          video.controls = true;
          item.appendChild(video);
        } else {
          item.textContent = '❌ Unsupported file type.';
        }

        preview.appendChild(item);
      });
    });
  </script>

</body>
</html>
