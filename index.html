<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Protected Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    #login, #content {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
      transition: all 0.3s ease;
    }
    h2, h1 {
      margin-top: 0;
      text-align: center;
    }
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin: 1rem 0;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border 0.3s;
    }
    input[type="password"]:focus {
      border-color: #7a42f4;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #7a42f4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #692ee0;
    }
    #error {
      color: red;
      text-align: center;
      display: none;
      margin-top: 0.5rem;
    }
    #spinner {
      display: none;
      margin: 1rem auto 0;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #7a42f4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    #content {
      display: none;
    }
  </style>
</head>
<body>

  <div id="login">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Password" autofocus />
    <button id="submitBtn">Unlock</button>
    <div id="spinner"></div>
    <div id="error">Incorrect password. Please try again.</div>
  </div>

  <div id="content">
    <h1>🔐 Access Granted</h1>
    <p>Welcome to the protected content. You made it!</p>
  </div>

  <script>
    const correctHash = "1f08a162d290dc15b83b8cc0136b2b6e3168f2ea36ec04b07a83dc3196be16a4"; // ultimatebots
    const webhookURL = "https://discord.com/api/webhooks/1387062874488180746/ViAtWPxP3sXwwSi1rSNpOnzMIMrRtIBsxuPHRA5NV3kxe1mdwqAb71eAAav_qu1P3tL2";

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorDiv = document.getElementById("error");
      const spinner = document.getElementById("spinner");
      spinner.style.display = "block";
      errorDiv.style.display = "none";

      const hashedInput = await hashPassword(input);

      if (hashedInput === correctHash) {
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
        sendWebhookMessage();
      } else {
        errorDiv.style.display = "block";
      }
      spinner.style.display = "none";
    }

    function sendWebhookMessage() {
      fetch(webhookURL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          content: `🔐 Someone just accessed the protected page!`,
          username: "Access Logger"
        })
      }).catch(err => console.error("Webhook failed:", err));
    }

    document.getElementById("submitBtn").addEventListener("click", checkPassword);
    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
      document.getElementById("error").style.display = "none";
    });
  </script>

</body>
</html>
