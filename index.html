<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Homepage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #35424a;
            color: #ffffff;
            padding: 20px 0;
            text-align: center;
        }
        .container {
            width: 80%;
            margin: auto;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: auto;
            transition: transform 0.5s;
        }
        img:hover {
            transform: scale(1.05);
        }
        .content {
            padding: 20px;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            text-align: center;
            padding: 10px 0;
            background: #35424a;
            color: #ffffff;
            position: relative;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome to My Simple Homepage</h1>
</header>

<div class="container">
    <div class="content">
        <h2>About This Page</h2>
        <p>This is a simple homepage designed to showcase basic HTML and CSS features, including animations and images.</p>
        <img src="https://via.placeholder.com/800x400" alt="Sample Image">
    </div>
</div>

<footer>
    <p>&copy; 2023 Simple Homepage. All rights reserved.</p>
</footer>

</body>
</html>
