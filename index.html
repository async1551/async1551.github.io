<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Bots</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="ultimatebotslogo.png" type="image/png" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f0f0ff, #ffffff);
      color: #333;
    }

    header {
      background-color: #7a42f4;
      color: white;
      padding: 1.2rem;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #eee;
      padding: 0.8rem;
      gap: 1.2rem;
    }

    nav button {
      background: #7a42f4;
      border: none;
      color: white;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    nav button.active,
    nav button:hover {
      background: #5d2bd8;
    }

    .section {
      display: none;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
      animation: fadeIn 0.4s ease forwards;
    }

    .section.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    input[type="password"],
    button,
    input[type="file"] {
      width: 100%;
      padding: 0.7rem;
      margin: 0.5rem 0;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button#submitBtn {
      background: #7a42f4;
      color: white;
      border: none;
    }

    button#submitBtn:hover {
      background: #5d2bd8;
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 0.5rem;
      display: none;
    }

    .preview {
      display: grid;
      gap: 1rem;
      margin-top: 1rem;
    }

    .preview-item {
      text-align: center;
    }

    img,
    video {
      max-width: 100%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Ultimate Bots</h1>
    <p>Powerful tools for your Discord server</p>
  </header>

  <nav>
    <button id="homeBtn" class="active">Home</button>
    <button id="showcasesBtn">Showcases</button>
  </nav>

  <!-- Home Section -->
  <section id="home" class="section active">
    <h2>🔒 Enter Password to Continue</h2>
    <input type="password" id="passwordInput" placeholder="Enter password..." />
    <button id="submitBtn">Unlock</button>
    <div id="error">❌ Incorrect password</div>
    <div id="homeContent" style="display: none; margin-top: 1rem;">
      <p>✅ Access granted! Use the menu to view showcases.</p>
    </div>
  </section>

  <!-- Showcases Section -->
  <section id="showcases" class="section">
    <h2>📁 Upload Your Showcase</h2>
    <input type="file" id="fileInput" accept=".png,.jpg,.jpeg,.mp4" multiple />
    <div class="preview" id="preview"></div>
  </section>

  <script>
    const correctPassword = "ultimatebots";

    const homeBtn = document.getElementById("homeBtn");
    const showcasesBtn = document.getElementById("showcasesBtn");
    const homeSection = document.getElementById("home");
    const showcasesSection = document.getElementById("showcases");

    const passwordInput = document.getElementById("passwordInput");
    const submitBtn = document.getElementById("submitBtn");
    const error = document.getElementById("error");
    const homeContent = document.getElementById("homeContent");

    let accessGranted = false;

    function switchSection(section) {
      [homeSection, showcasesSection].forEach(s => s.classList.remove("active"));
      section.classList.add("active");

      [homeBtn, showcasesBtn].forEach(b => b.classList.remove("active"));
      if (section === homeSection) homeBtn.classList.add("active");
      else showcasesBtn.classList.add("active");
    }

    homeBtn.onclick = () => switchSection(homeSection);
    showcasesBtn.onclick = () => {
      if (accessGranted) {
        switchSection(showcasesSection);
      } else {
        alert("🔐 Please enter the correct password first.");
        switchSection(homeSection);
      }
    };

    submitBtn.onclick = () => {
      error.style.display = "none";
      if (passwordInput.value === correctPassword) {
        accessGranted = true;
        homeContent.style.display = "block";
      } else {
        error.style.display = "block";
        homeContent.style.display = "none";
      }
    };

    // File Preview Logic
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");

    fileInput.addEventListener("change", () => {
      preview.innerHTML = "";
      [...fileInput.files].forEach(file => {
        const url = URL.createObjectURL(file);
        const item = document.createElement("div");
        item.className = "preview-item";

        if (file.type.startsWith("image/")) {
          const img = document.createElement("img");
          img.src = url;
          item.appendChild(img);
        } else if (file.type === "video/mp4") {
          const video = document.createElement("video");
          video.src = url;
          video.controls = true;
          item.appendChild(video);
        } else {
          item.textContent = "❌ Unsupported file type";
        }

        preview.appendChild(item);
      });
    });
  </script>

</body>
</html>
