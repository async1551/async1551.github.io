<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Club 19</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito&display=swap');

  body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background: url('websitebackground.jpeg') no-repeat center center fixed;
    background-size: cover;
    color: #d7d2c5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  nav {
    position: fixed;
    top: 20px;
    width: 100%;
    text-align: center;
    font-weight: 600;
    font-size: 1.1rem;
  }

  nav a {
    margin: 0 15px;
    color: #d7d2c5cc;
    text-decoration: none;
    transition: color 0.3s;
  }

  nav a.active, nav a:hover {
    color: white;
  }

  main {
    text-align: center;
  }

  main h1 {
    font-size: 4rem;
    font-weight: 700;
    margin: 0.3em 0;
    color: #d7d2c5cc;
  }

  main h2 {
    font-weight: 600;
    font-size: 6rem;
    color: #e16628;
    margin: 0.2em 0;
  }

  main p {
    max-width: 480px;
    margin: 1em auto 2em auto;
    font-size: 1.1rem;
    line-height: 1.5;
    color: #d7d2c5cc;
  }

  button {
    border: 1px solid #d7d2c5cc;
    background: transparent;
    color: #d7d2c5cc;
    padding: 0.7em 1.5em;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: background-color 0.3s, color 0.3s;
    letter-spacing: 1px;
  }

  button:hover {
    background-color: #d7d2c5cc;
    color: #1a1a1a;
  }

  /* Vertical line below button */
  .vertical-line {
    margin: 3em auto 0 auto;
    width: 1px;
    height: 80px;
    background: #d7d2c5cc;
  }
</style>
</head>
<body>
<nav>
  <a href="#" class="active">Home</a>
  <a href="#">News</a>
  <a href="#">X World</a>
</nav>

<main>
  <img src="c19logo.png" style="height: 12rem; margin: 0.2em 0; color: #e16628;" />
  <h1>Club 19</h1>
  <p>Let's be the change we want to see on the internet.</p>
  <button onclick="window.location.href='https://discord.gg/MNrxCGSdqP'">Join our Discord Server</button>
  <div class="vertical-line"></div>
</main>
</body>
</html>
