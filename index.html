<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ultimate Bots Base</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    #login, #content {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1, h2 {
      text-align: center;
      margin: 0 0 1rem;
    }

    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border 0.3s ease;
    }

    input[type="password"]:focus {
      border-color: #7a42f4;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background-color: #7a42f4;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #692ee0;
      transform: scale(1.02);
    }

    #error {
      color: red;
      text-align: center;
      margin-top: 0.5rem;
      display: none;
    }

    #spinner {
      display: none;
      margin: 1rem auto 0;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #7a42f4;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #content {
      display: none;
      text-align: center;
    }

    #content p {
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <div id="login">
    <h2>Enter Password</h2>
    <input type="password" id="passwordInput" placeholder="Password" autofocus />
    <button id="submitBtn">Unlock</button>
    <div id="spinner"></div>
    <div id="error">❌ Incorrect password. Try again.</div>
  </div>

  <div id="content">
    <h1>✅ Access Granted</h1>
    <p>Welcome to the protected content. Enjoy your stay!</p>
  </div>

  <script>
    const correctHash = "1f08a162d290dc15b83b8cc0136b2b6e3168f2ea36ec04b07a83dc3196be16a4"; // ultimatebots
    const webhookURL = "https://discord.com/api/webhooks/1387062874488180746/ViAtWPxP3sXwwSi1rSNpOnzMIMrRtIBsxuPHRA5NV3kxe1mdwqAb71eAAav_qu1P3tL2";

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const errorDiv = document.getElementById("error");
      const spinner = document.getElementById("spinner");

      errorDiv.style.display = "none";
      spinner.style.display = "block";

      const hashedInput = await hashPassword(input);

      if (hashedInput === correctHash) {
        document.getElementById("login").style.display = "none";
        document.getElementById("content").style.display = "block";
        sendWebhookMessage();
      } else {
        errorDiv.style.display = "block";
      }

      spinner.style.display = "none";
    }

    function sendWebhookMessage() {
      fetch(webhookURL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          content: "🔐 Someone logged into the protected page!",
          username: "Access Logger"
        })
      }).catch(console.error);
    }

    document.getElementById("submitBtn").addEventListener("click", checkPassword);
    document.getElementById("passwordInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") checkPassword();
      document.getElementById("error").style.display = "none";
    });
  </script>

</body>
</html>
