<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ticket Transcript Search</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f9f9f9;
      color: #222;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    input[type="search"] {
      width: 100%;
      padding: 12px 15px;
      font-size: 1.1em;
      border: 2px solid #ccc;
      border-radius: 6px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    ul {
      list-style-type: none;
      padding-left: 0;
    }
    li {
      background: #fff;
      margin-bottom: 10px;
      padding: 15px 20px;
      border-radius: 8px;
      box-shadow: 0 0 6px #ddd;
    }
    a {
      color: #0077cc;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover {
      text-decoration: underline;
    }
    .meta {
      font-size: 0.9em;
      color: #555;
      margin-top: 4px;
    }
    .no-results {
      text-align: center;
      color: #999;
      margin-top: 50px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <h1>Search Ticket Transcripts</h1>
  <input type="search" id="searchInput" placeholder="Search by ticket ID, user, keywords, or date..." autofocus />

  <ul id="results"></ul>

  <script>
    let transcripts = [];

    async function loadIndex() {
      try {
        const response = await fetch('transcripts/index.json');
        transcripts = await response.json();
        renderResults(transcripts);
      } catch (e) {
        document.getElementById('results').innerHTML = '<li class="no-results">Failed to load transcripts index.</li>';
        console.error(e);
      }
    }

    function search(query) {
      query = query.trim().toLowerCase();
      if (!query) return transcripts;

      return transcripts.filter(t => {
        return (
          (t.filename && t.filename.toLowerCase().includes(query)) ||
          (t.user && t.user.toLowerCase().includes(query)) ||
          (t.date && t.date.toLowerCase().includes(query)) ||
          (t.keywords && t.keywords.some(k => k.toLowerCase().includes(query))) ||
          (t.title && t.title.toLowerCase().includes(query))
        );
      });
    }

    function renderResults(results) {
      const ul = document.getElementById('results');
      ul.innerHTML = '';

      if (results.length === 0) {
        ul.innerHTML = '<li class="no-results">No transcripts found.</li>';
        return;
      }

      for (const t of results) {
        const li = document.createElement('li');

        const link = document.createElement('a');
        link.href = t.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = t.title || t.filename || "Transcript";

        li.appendChild(link);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `User: ${t.user || 'Unknown'} | Date: ${t.date || 'Unknown'}` + (t.keywords ? ` | Keywords: ${t.keywords.join(', ')}` : '');
        li.appendChild(meta);

        ul.appendChild(li);
      }
    }

    document.getElementById('searchInput').addEventListener('input', e => {
      const filtered = search(e.target.value);
      renderResults(filtered);
    });

    loadIndex();
  </script>
</body>
</html>
